<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050505" />
    <meta name="robots" content="noindex, nofollow" />
    <title>GLSL Cobblestone — Castle Stones Demo</title>
    <script>
      document.documentElement.classList.add('js');
    </script>
  </head>
  <body>
    <section class="flight-hero">
      <canvas id="cobblestone-canvas"></canvas>
      <div class="flight-hero-copy">
        <h1 class="flight-hero-title">
          <span class="flight-hero-eyebrow" data-animate>Floors with a story</span>
          <span data-animate>History Beneath Your Feet.</span>
        </h1>
        <p class="flight-hero-sub" data-animate>
          Historic character, reimagined for contemporary spaces.
        </p>
      </div>
    </section>

    <script type="module" src="/src/generative-cobblestone-demo.js"></script>
  </body>
</html>
