<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050505" />
    <meta name="robots" content="noindex, nofollow" />
    <title>GLSL Hills — Demo</title>
    <script>
      document.documentElement.classList.add('js');
    </script>
  </head>
  <body>
    <section class="glsl-hills-hero">
      <canvas id="hills-canvas"></canvas>
      <div class="glsl-hills-copy">
        <h1 class="glsl-hills-title">
          <span class="glsl-hills-eyebrow" data-animate>Designs That Speak</span>
          <span data-animate>Louder Than Words</span>
        </h1>
        <p class="glsl-hills-sub" data-animate>
          We craft stunning visuals and user-friendly experiences that help your brand stand out and
          connect with your audience.
        </p>
      </div>
    </section>

    <script type="module" src="/src/generative-hero-demo.js"></script>
  </body>
</html>
